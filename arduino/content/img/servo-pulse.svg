<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
<rect width="900" height="500" fill="#f5f3ed"/>
<text x="450.0" y="42" fill="#1b1e22" font-family="DM Sans,sans-serif" font-size="20" font-weight="700" text-anchor="middle">The width of the pulse is the message</text>
<text x="188" y="128" fill="#c4551a" font-family="JetBrains Mono,monospace" font-size="18" font-weight="700" text-anchor="end">1.0 ms</text>
<rect x="210" y="100" width="118" height="46" fill="#c4551a" opacity=".14"/>
<polyline points="210,146 210,100 328,100 328,146 398,146" fill="none" stroke="#c4551a" stroke-width="3"/>
<line x1="398" y1="146" x2="510" y2="146" stroke="#c4551a" stroke-width="3" stroke-dasharray="7,6" opacity=".55"/>
<line x1="210" y1="86" x2="328" y2="86" stroke="#00767d" stroke-width="1.6"/>
<line x1="210" y1="81" x2="210" y2="91" stroke="#00767d" stroke-width="1.6"/>
<line x1="328" y1="81" x2="328" y2="91" stroke="#00767d" stroke-width="1.6"/>
<path d="M 656 126 A 44 44 0 0 1 744 126" fill="none" stroke="#d9d3c7" stroke-width="8" stroke-linecap="round"/>
<circle cx="700" cy="126" r="13" fill="#fff" stroke="#1b1e22" stroke-width="2.5"/>
<line x1="700" y1="126" x2="654.0" y2="126.0" stroke="#00767d" stroke-width="5" stroke-linecap="round"/>
<text x="772" y="132" fill="#00767d" font-family="DM Sans,sans-serif" font-size="17" font-weight="700">0 deg</text>
<text x="188" y="248" fill="#c4551a" font-family="JetBrains Mono,monospace" font-size="18" font-weight="700" text-anchor="end">1.5 ms</text>
<rect x="210" y="220" width="177" height="46" fill="#c4551a" opacity=".14"/>
<polyline points="210,266 210,220 387,220 387,266 457,266" fill="none" stroke="#c4551a" stroke-width="3"/>
<line x1="457" y1="266" x2="510" y2="266" stroke="#c4551a" stroke-width="3" stroke-dasharray="7,6" opacity=".55"/>
<line x1="210" y1="206" x2="387" y2="206" stroke="#00767d" stroke-width="1.6"/>
<line x1="210" y1="201" x2="210" y2="211" stroke="#00767d" stroke-width="1.6"/>
<line x1="387" y1="201" x2="387" y2="211" stroke="#00767d" stroke-width="1.6"/>
<path d="M 656 246 A 44 44 0 0 1 744 246" fill="none" stroke="#d9d3c7" stroke-width="8" stroke-linecap="round"/>
<circle cx="700" cy="246" r="13" fill="#fff" stroke="#1b1e22" stroke-width="2.5"/>
<line x1="700" y1="246" x2="700.0" y2="200.0" stroke="#00767d" stroke-width="5" stroke-linecap="round"/>
<text x="772" y="252" fill="#00767d" font-family="DM Sans,sans-serif" font-size="17" font-weight="700">90 deg</text>
<text x="188" y="368" fill="#c4551a" font-family="JetBrains Mono,monospace" font-size="18" font-weight="700" text-anchor="end">2.0 ms</text>
<rect x="210" y="340" width="236" height="46" fill="#c4551a" opacity=".14"/>
<polyline points="210,386 210,340 446,340 446,386 516,386" fill="none" stroke="#c4551a" stroke-width="3"/>
<line x1="516" y1="386" x2="510" y2="386" stroke="#c4551a" stroke-width="3" stroke-dasharray="7,6" opacity=".55"/>
<line x1="210" y1="326" x2="446" y2="326" stroke="#00767d" stroke-width="1.6"/>
<line x1="210" y1="321" x2="210" y2="331" stroke="#00767d" stroke-width="1.6"/>
<line x1="446" y1="321" x2="446" y2="331" stroke="#00767d" stroke-width="1.6"/>
<path d="M 656 366 A 44 44 0 0 1 744 366" fill="none" stroke="#d9d3c7" stroke-width="8" stroke-linecap="round"/>
<circle cx="700" cy="366" r="13" fill="#fff" stroke="#1b1e22" stroke-width="2.5"/>
<line x1="700" y1="366" x2="746.0" y2="366.0" stroke="#00767d" stroke-width="5" stroke-linecap="round"/>
<text x="772" y="372" fill="#00767d" font-family="DM Sans,sans-serif" font-size="17" font-weight="700">180 deg</text>
<text x="420" y="418" fill="#5d6670" font-family="DM Sans,sans-serif" font-size="15" text-anchor="middle">then nothing, until the next pulse 20 ms later</text>
<text x="450.0" y="460" fill="#1b1e22" font-family="DM Sans,sans-serif" font-size="18" font-weight="700" text-anchor="middle">A pulse every 20 ms, and its width says where to go.</text>
<text x="450.0" y="486" fill="#5d6670" font-family="DM Sans,sans-serif" font-size="16" text-anchor="middle">The servo holds that position on its own until you tell it another one.</text>
</svg>