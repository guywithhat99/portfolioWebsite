<text x="205" y="342" fill="#1b1e22" font-family="DM Sans,sans-serif" font-size="16" font-weight="700" text-anchor="middle">the actual part</text>
<text x="205" y="364" fill="#5d6670" font-family="DM Sans,sans-serif" font-size="15" text-anchor="middle">a grey stripe near one end</text>
<text x="655" y="342" fill="#1b1e22" font-family="DM Sans,sans-serif" font-size="16" font-weight="700" text-anchor="middle">how it is drawn</text>
