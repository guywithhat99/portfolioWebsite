<text x="656" y="206" fill="#c4551a" font-family="DM Sans,sans-serif" font-size="16" font-weight="700" text-anchor="middle">the bar</text>
<line x1="255" y1="216" x2="255" y2="250" stroke="#c4551a" stroke-width="2"/>
<line x1="656" y1="216" x2="656" y2="246" stroke="#c4551a" stroke-width="2"/>
<line x1="70" y1="280" x2="140" y2="280" stroke="#9aa0a6" stroke-width="4"/>
<line x1="270" y1="280" x2="340" y2="280" stroke="#9aa0a6" stroke-width="4"/>
