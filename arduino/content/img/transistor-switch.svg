<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg">
<rect width="900" height="450" fill="#f5f3ed"/>
<text x="450.0" y="42" fill="#1b1e22" font-family="DM Sans,sans-serif" font-size="20" font-weight="700" text-anchor="middle">A transistor lets a small current control a big one</text>
<line x1="560" y1="204" x2="560" y2="296" stroke="#1b1e22" stroke-width="5"/>
<line x1="488" y1="250" x2="560" y2="250" stroke="#1b1e22" stroke-width="2.5"/>
<line x1="560" y1="218" x2="616" y2="170" stroke="#1b1e22" stroke-width="2.5"/>
<line x1="616" y1="170" x2="616" y2="112" stroke="#1b1e22" stroke-width="2.5"/>
<line x1="560" y1="282" x2="616" y2="330" stroke="#1b1e22" stroke-width="2.5"/>
<line x1="616" y1="330" x2="616" y2="388" stroke="#1b1e22" stroke-width="2.5"/>
<polygon points="601,315 590,304 607,302" fill="#1b1e22"/>
<text x="552" y="280" fill="#00767d" font-family="DM Sans,sans-serif" font-size="16" font-weight="700" text-anchor="end">base</text>
<text x="638" y="120" fill="#b4241f" font-family="DM Sans,sans-serif" font-size="16" font-weight="700">collector</text>
<text x="638" y="140" fill="#5d6670" font-family="DM Sans,sans-serif" font-size="14">up to the motor</text>
<text x="638" y="382" fill="#5d6670" font-family="DM Sans,sans-serif" font-size="16" font-weight="700">emitter</text>
<text x="638" y="402" fill="#5d6670" font-family="DM Sans,sans-serif" font-size="14">down to ground</text>
<rect x="230" y="224" width="116" height="52" rx="7" fill="#fff" stroke="#00767d" stroke-width="2"/>
<text x="288" y="257" fill="#00767d" font-family="JetBrains Mono,monospace" font-size="17" text-anchor="middle">pin 9</text>
<line x1="346" y1="250" x2="392" y2="250" stroke="#1b1e22" stroke-width="2.5"/>
<rect x="392" y="236" width="38" height="28" fill="#d9c79a" stroke="#8a7f6a" stroke-width="1.5" rx="4"/>
<text x="411" y="224" fill="#5d6670" font-family="DM Sans,sans-serif" font-size="14" text-anchor="middle">330 Ohm</text>
<line x1="430" y1="250" x2="488" y2="250" stroke="#1b1e22" stroke-width="2.5"/>
<text x="410" y="292" fill="#00767d" font-family="DM Sans,sans-serif" font-size="16" font-weight="700" text-anchor="middle">a few mA</text>
<text x="720" y="174" fill="#b4241f" font-family="DM Sans,sans-serif" font-size="16" font-weight="700">hundreds of mA</text>
<text x="450.0" y="434" fill="#5d6670" font-family="DM Sans,sans-serif" font-size="17" text-anchor="middle">The pin never carries the motor current. It only opens and closes the valve.</text>
</svg>