<text x="450.0" y="500" fill="#1b1e22" font-family="DM Sans,sans-serif" font-size="18" font-weight="700" text-anchor="middle">A small current into the base lets a big current flow through the motor.</text>
<text x="450.0" y="526" fill="#5d6670" font-family="DM Sans,sans-serif" font-size="16" font-weight="400" text-anchor="middle">The pin never carries the motor current. It only opens and closes the valve.</text>
