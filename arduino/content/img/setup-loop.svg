<svg viewBox="0 0 460 430" xmlns="http://www.w3.org/2000/svg">
<rect width="460" height="430" fill="#f5f3ed"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#00767d"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c4551a"/></marker></defs>
<text x="210" y="30" fill="#5d6670" font-family="DM Sans,sans-serif" font-size="17" text-anchor="middle">power on</text>
<line x1="210" y1="42" x2="210" y2="74" stroke="#00767d" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="70" y="82" width="280" height="92" fill="#fff" stroke="#00767d" stroke-width="2.5" rx="8"/>
<text x="210" y="122" fill="#00767d" font-family="JetBrains Mono,monospace" font-size="26" font-weight="700" text-anchor="middle">setup()</text>
<text x="210" y="150" fill="#5d6670" font-family="DM Sans,sans-serif" font-size="17" text-anchor="middle">runs once</text>
<line x1="210" y1="176" x2="210" y2="216" stroke="#00767d" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="70" y="224" width="280" height="92" fill="#fff" stroke="#c4551a" stroke-width="2.5" rx="8"/>
<text x="210" y="264" fill="#c4551a" font-family="JetBrains Mono,monospace" font-size="26" font-weight="700" text-anchor="middle">loop()</text>
<text x="210" y="292" fill="#5d6670" font-family="DM Sans,sans-serif" font-size="17" text-anchor="middle">runs forever</text>
<path d="M 350 300 C 425 300, 425 232, 360 232 L 353 232" fill="none" stroke="#c4551a" stroke-width="2.5" marker-end="url(#b)"/>
<text x="210" y="360" fill="#5d6670" font-family="DM Sans,sans-serif" font-size="16" text-anchor="middle">reaches the bottom,</text>
<text x="210" y="382" fill="#5d6670" font-family="DM Sans,sans-serif" font-size="16" text-anchor="middle">starts again at the top</text>
<text x="210" y="412" fill="#5d6670" font-family="DM Sans,sans-serif" font-size="15" text-anchor="middle" font-style="italic">there is no exit</text>
</svg>